name: Build And Deploy Root Site

on:
  push:
    branches:
      - main
    paths:
      - "generate_site.py"
      - "generate_sitemap.py"
      - "site-config.json"
      - "site.webmanifest"
      - "assets/**"
      - "templates/**"
      - "wiki/**"
      - ".github/workflows/site.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: root-site-build-and-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate root site assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_site.py
      - name: Smoke check generated assets
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          placeholder_re = re.compile(r"__[A-Z0-9_]+__")
          required_files = [
              Path("index.html"),
              Path("portfolio/index.html"),
              Path("wiki/index.html"),
              Path("wiki/agents.html"),
              Path("codex-subagents.json"),
              Path("projects.json"),
              Path("sitemap.xml"),
              Path("rss.xml"),
              Path("feed.xml"),
              Path("robots.txt"),
              Path("site.webmanifest"),
              Path(".nojekyll"),
          ]

          missing = [str(path) for path in required_files if not path.exists()]

          config = json.loads(Path("site-config.json").read_text(encoding="utf-8"))
          generated_docs = []
          for document in config.get("wiki_documents", []):
              if document.get("source_path") and document.get("output_path"):
                  generated_docs.append(Path(document["output_path"]))

          missing.extend(str(path) for path in generated_docs if not path.exists())

          html_targets = [Path("index.html"), Path("wiki/index.html"), *generated_docs]
          html_targets.extend([Path("portfolio/index.html"), Path("wiki/agents.html")])
          unresolved = []
          for path in html_targets:
              text = path.read_text(encoding="utf-8")
              if placeholder_re.search(text):
                  unresolved.append(str(path))

          if missing or unresolved:
              if missing:
                  print("Missing generated files:")
                  for path in missing:
                      print(f" - {path}")
              if unresolved:
                  print("Files with unresolved placeholders:")
                  for path in unresolved:
                      print(f" - {path}")
              raise SystemExit(1)

          print("Smoke check passed.")
          PY
      - name: Commit generated assets
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .nojekyll index.html portfolio/index.html wiki/*.html sitemap.xml rss.xml feed.xml robots.txt projects.json codex-subagents.json site.webmanifest
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh root site assets [skip ci]"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r assets _site/assets
          cp -r portfolio _site/portfolio
          cp -r wiki _site/wiki
          cp index.html projects.json sitemap.xml rss.xml feed.xml robots.txt codex-subagents.json site.webmanifest .nojekyll _site/
          cp googleb146312c1195390f.html naver637a8890bce9d21fe787686e75fea7aa.html _site/
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
